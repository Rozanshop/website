// helper to safely encode image/video paths and provide a placeholder
function getSrc(path) {
    if (!path) return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#f3f3f3"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#999" font-family="Arial" font-size="20">No image</text></svg>');
    return encodeURI(path);
}

// ==============================
// CART & SHIPPING
// ==============================
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let userTaxRate = 0.0875; // 0% tax
function calculateTax(subtotal, state) {
    const nycTaxRate = 0.08875;
    const nyStateTaxRate = 0.04; // outside NYC
    const otherStateTaxRate = 0; // if no nexus

    if (state === "NY") {
        // Assume NYC if city field says NYC, otherwise state tax
        return subtotal * nycTaxRate; 
    } else {
        return subtotal * otherStateTaxRate;
    }
}
let userShippingRate = 0;
let shippingType = "standard";

function calculateTotals() {
    let subtotal = 0;
    cart.forEach(item => subtotal += item.price);
    let shipping = cart.length ? userShippingRate : 0;
    if (shippingType === "express" && cart.length) shipping += 15;
    let tax = subtotal * userTaxRate;
    let total = subtotal + shipping + tax;
    return {subtotal, shipping, tax, total};
}

function setShipping(type) {
    shippingType = type;

}

// REMOVE ITEM FUNCTION (preserve shipping info)
// ==============================
function removeFromCart(index) {
    // Save current form info before removing
    const form = document.getElementById("checkoutForm");
    if (form) {
        window.checkoutInfo = {
            name: form.name.value,
            email: form.email.value,
            address: form.address.value,
            city: form.city.value,
            state: form.state.value,
            zip: form.zip.value,
            phone: form.phone.value
        };
    }

    // Remove item from cart
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();

    // Re-render checkout form with preserved info
    renderCheckoutForm();
}

        createOrder: function(data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: {
                        currency_code: "USD",
                        value: total.toFixed(2),
                        breakdown: {
                            item_total: {currency_code: "USD", value: subtotal.toFixed(2)},
                            shipping: {currency_code: "USD", value: shipping.toFixed(2)},
                            tax_total: {currency_code: "USD", value: tax.toFixed(2)}
                        }
                    },
                    items: cart.map(item => ({
                        name: item.name,
                        unit_amount: {currency_code: "USD", value: item.price.toFixed(2)},
                        quantity: "1"
                    }))
                }]
            });

                const purchasedProducts = cart.map(item => item.name).join(", ");

                    <input type="hidden" name="address" value="${window.checkoutInfo.address}">
                    <input type="hidden" name="city" value="${window.checkoutInfo.city}">
                    <input type="hidden" name="state" value="${window.checkoutInfo.state}">
                    <input type="hidden" name="zip" value="${window.checkoutInfo.zip}">
                    <input type="hidden" name="phone" value="${window.checkoutInfo.phone}">
                    <input type="hidden" name="products" value="${purchasedProducts}">
                    <input type="hidden" name="orderID" value="${data.orderID}">
                    <input type="hidden" name="total" value="${total.toFixed(2)}">
                `;
                document.body.appendChild(form);
                form.submit();

                cart = [];

                updateCartCount();

                document.getElementById("app").innerHTML = `
                    <div class="section">
                        <h2>🎉 Thank You, ${window.checkoutInfo.name}!</h2>
                        <p>Your order has been placed successfully.</p>
                        <p><strong>Order ID:</strong> ${data.orderID}</p>
                        <p><strong>Total Paid:</strong> $${total.toFixed(2)}</p>
                    </div>
                `;
            });
        },
      onCancel: function() {
    alert("Payment cancelled. Your cart is intact.");
    
    // Re-render the checkout page with the current cart and pre-filled shipping info
    renderCheckoutForm(); 
},
onError: function(err) {
    console.error(err);
    alert("Checkout error.");
}
}).render('#paypal-button-container');
}

function renderCategory(category) {
    const filtered = products.filter(p => p.category === category);
    let html = `<div class="section"><h2>${category}</h2><div class="products">`;
    filtered.forEach((p, i) => {
        html += `<div class="product-card" onclick="renderProduct(${products.indexOf(p)})">

                    <h3>${p.name}</h3>
                    <p>$${p.price?.toLocaleString() || 'N/A'}</p>
                 </div>`;
    });

    document.getElementById("app").innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==============================
// PRODUCT PAGE (with Magnifier)
// ==============================
let magnifierZoomed = false;
let magnifierImg, magnifierModal;
function renderProduct(id) {
    const p = products[id];
    const videoSrc = p.video;
    let allImages = p.images;

    let html = `<div class="section" style="max-width:900px;margin:0 auto;">
        <div class="product-container" style="display:flex;flex-direction:column;align-items:center;gap:30px;">
            <div class="images-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:15px;width:100%;">
                ${allImages.map((img, i) => `
                    <div class="zoom-wrapper" style="overflow:hidden;border-radius:10px;cursor:pointer;position:relative;">
                        <img src="${img}" alt="${p.name}" style="width:100%;height:350px;object-fit:cover;" onclick="openMagnifierModal(${id}, ${i})">
                    </div>`).join('')}
            </div>
                      ${videoSrc ? `
    <video controls autoplay loop muted 
        style="width: 100%; aspect-ratio: 16/9; object-fit: contain; border-radius: 10px; display:block; margin: 0 auto;">
    <source src="${videoSrc}" type="video/mp4">
    </video>` : ''}
            <div class="product-info" style="max-width:600px;text-align:center;">
                <h2 style="font-family:'Playfair Display', serif;margin-bottom:15px;">${p.name}</h2>
                <p style="line-height:1.6;margin-bottom:20px;">${p.desc}</p>
                <p style="color:#b89b5e;font-weight:600;font-size:20px;margin-bottom:25px;">$${p.price?.toLocaleString() || 'N/A'}</p>
                <button onclick="addToCart(${id})" style="padding:15px 50px;font-weight:600;font-size:16px;background:red;border-radius:50px;color:white;border:none;cursor:pointer;">Add to Cart</button>
                <button onclick="renderCategory('${p.category}')" style="margin-top:15px;background:transparent;border:none;color:red;cursor:pointer;text-decoration:underline;">Back to ${p.category}</button>
            </div>
        </div>
    </div>

    <div id="magnifier-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:10000;">
        <div style="position:relative;max-width:90vw;max-height:90vh;overflow:hidden;border-radius:10px;background:#fff;cursor:zoom-in;">
            <img id="magnifier-img" src="" alt="Magnified Image" style="width:100%;max-height:90vh;object-fit:contain;transition:transform 0.3s ease;">
            <button onclick="closeMagnifierModal()" style="position:absolute;top:10px;right:10px;background:red;color:white;border:none;font-size:18px;padding:6px 12px;border-radius:5px;cursor:pointer;">×</button>
        </div>
    </div>`;

    document.getElementById("app").innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openMagnifierModal(productId, imgIndex) {
    magnifierModal = document.getElementById('magnifier-modal');
    magnifierImg = document.getElementById('magnifier-img');
    if (!magnifierModal || !magnifierImg) return;

    magnifierImg.src = products[productId].images[imgIndex];
    magnifierZoomed = false;
    magnifierImg.style.transform = 'scale(1)';
    magnifierImg.style.transformOrigin = 'center center';
    magnifierImg.style.cursor = 'zoom-in';
    magnifierModal.style.display = 'flex';

    magnifierImg.onclick = function(event) {
        magnifierZoomed = !magnifierZoomed;
        if (magnifierZoomed) {
            const rect = magnifierImg.getBoundingClientRect();
            const offsetX = event.clientX - rect.left;
            const offsetY = event.clientY - rect.top;
            const originXPercent = (offsetX / rect.width) * 100;
            const originYPercent = (offsetY / rect.height) * 100;
            magnifierImg.style.transformOrigin = `${originXPercent}% ${originYPercent}%`;
            magnifierImg.style.transform = 'scale(2)';
            magnifierImg.style.cursor = 'zoom-out';
        } else {
            magnifierImg.style.transformOrigin = 'center center';
            magnifierImg.style.transform = 'scale(1)';
            magnifierImg.style.cursor = 'zoom-in';
        }
    };
}

function closeMagnifierModal() {
    if (magnifierModal) magnifierModal.style.display = 'none';
}
